<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><rect width="600" height="780" fill="#f5f2e9"/><g font-family="Arial,sans-serif" fill="#193b30"><text x="30" y="44" font-size="28" font-weight="700">Three different size boundaries</text><text x="30" y="80" font-size="23">Top view · schematic · not to scale</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#193b30"/></marker></defs><g stroke="#193b30" stroke-width="2"><rect x="55" y="160" width="490" height="240" rx="8" fill="#cfb994"/><rect x="78" y="183" width="444" height="194" fill="#fffdf7"/><rect x="155" y="226" width="290" height="95" rx="9" fill="#a7c4b6"/><path d="M82 140H518" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M161 343H439" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M60 429H540" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g><g font-family="Arial,sans-serif" fill="#193b30" text-anchor="middle" font-size="24"><text x="300" y="125">Internal length</text><text x="300" y="282" font-weight="700">PRODUCT</text><text x="300" y="369">Product length</text><text x="300" y="464">Finished external length</text></g><g font-family="Arial,sans-serif" fill="#193b30" font-size="24"><text x="30" y="514" font-weight="700">1  Product envelope</text><text x="30" y="545">Include caps and protrusions.</text><text x="30" y="588" font-weight="700">2  Internal cavity</text><text x="30" y="619">Recheck with the insert installed.</text><text x="30" y="662" font-weight="700">3  Finished outside</text><text x="30" y="693">Measure with the box closed.</text><text x="30" y="745" font-size="22">Repeat for width and height.</text></g></svg>
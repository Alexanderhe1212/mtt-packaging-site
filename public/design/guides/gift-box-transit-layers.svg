<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700"><rect width="600" height="700" rx="20" fill="#f5f2e8"/><g font-family="Arial,sans-serif" fill="#19372c"><text x="35" y="55" font-size="28" font-weight="700">Three jobs in one shipment</text><text x="35" y="88" font-size="20">Review every layer with the actual product.</text><rect x="30" y="120" width="540" height="146" rx="10" fill="white" stroke="#c9c5b5"/><text x="48" y="155" font-size="20" fill="#746344">01 / PRODUCT + INSERT</text><text x="48" y="196" font-size="25" font-weight="700">Restrain movement</text><text x="48" y="232" font-size="19">Check fragile and decorated contact points.</text><path d="M300 270v20m-7-7 7 7 7-7" stroke="#746344" fill="none" stroke-width="2"/><rect x="30" y="294" width="540" height="146" rx="10" fill="white" stroke="#c9c5b5"/><text x="48" y="329" font-size="20" fill="#746344">02 / CLOSED GIFT BOX</text><text x="48" y="370" font-size="25" font-weight="700">Preserve presentation</text><text x="48" y="406" font-size="19">Check corners, lid, wrapping and removal.</text><path d="M300 444v20m-7-7 7 7 7-7" stroke="#746344" fill="none" stroke-width="2"/><rect x="30" y="468" width="540" height="146" rx="10" fill="white" stroke="#c9c5b5"/><text x="48" y="503" font-size="20" fill="#746344">03 / PROTECTIVE OUTER PACK</text><text x="48" y="544" font-size="25" font-weight="700">Assess the complete shipment</text><text x="48" y="580" font-size="19">Check supports, carton, closure and route.</text><text x="35" y="677" font-size="18">Schematic only. Final construction requires review.</text></g></svg>
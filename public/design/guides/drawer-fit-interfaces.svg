<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="drawer-fit-interfaces-title drawer-fit-interfaces-desc" id="drawer-fit-interfaces-root">
<title id="drawer-fit-interfaces-title">Three checks for a loaded rigid drawer box</title><desc id="drawer-fit-interfaces-desc">A side cutaway identifies loaded height, sliding surfaces and fabric pull attachment; gaps are exaggerated and no clearance is prescribed.</desc>
  <defs>
      <style>#drawer-fit-interfaces-root { font-family: Arial,sans-serif; color: #193b30; }
      #drawer-fit-interfaces-root text { font-family:Arial,sans-serif;fill:#193b30 }</style>
  </defs>
<rect width="600" height="800" fill="#f5f2e9"/>
<text x="28" y="44" font-size="28" font-weight="700">Three checks for a loaded drawer</text>
<text x="28" y="80" font-size="21">Side cutaway · not a cutting drawing</text>
<text x="40" y="132" font-size="20" font-weight="700">SLEEVE</text>
<path d="M40 152H440V172H60V316H440V336H40Z" fill="#cfb994" stroke="#193b30" stroke-width="2"/>
<path d="M84 204H100V284H384V204H400V300H84Z" fill="#d6e3db" stroke="#193b30" stroke-width="2"/>
<rect x="112" y="260" width="260" height="12" fill="#cfb994" stroke="#193b30" stroke-width="2"/>
<rect x="136" y="208" width="212" height="52" rx="6" fill="#fffdf7" stroke="#193b30" stroke-width="2"/>
<text x="242" y="240" text-anchor="middle" font-size="22">Product + liner</text>
<path d="M400 240H452Q480 240 480 260Q480 280 452 280H400" fill="none" stroke="#8a6837" stroke-width="8"/>
<g fill="#193b30"><circle cx="372" cy="188" r="16"/><circle cx="424" cy="308" r="16"/><circle cx="512" cy="260" r="16"/></g>
<g text-anchor="middle" font-size="20" font-weight="700"><text x="372" y="195" style="fill:#fffdf7">1</text><text x="424" y="315" style="fill:#fffdf7">2</text><text x="512" y="267" style="fill:#fffdf7">3</text></g>
<text x="40" y="372" font-size="20" font-weight="700">WRAPPED TRAY + INSERT</text>
<path d="M336 372H472M456 364L472 372L456 380" fill="none" stroke="#193b30" stroke-width="2"/>
<text x="336" y="408" font-size="20">Opening direction</text>
<path d="M28 440H572" stroke="#a7b0a6"/>
<text x="28" y="484" font-size="24" font-weight="700">1  Loaded height</text>
<text x="28" y="516" font-size="22">Check the contents at the sleeve opening.</text>
<text x="28" y="568" font-size="24" font-weight="700">2  Sliding surfaces</text>
<text x="28" y="600" font-size="22">Compare the empty, fitted and loaded tray.</text>
<text x="28" y="652" font-size="24" font-weight="700">3  Pull attachment</text>
<text x="28" y="684" font-size="22">Check the fabric, lining and front together.</text>
<text x="28" y="744" font-size="20">Gaps exaggerated. No approved layout,</text>
<text x="28" y="772" font-size="20">clearance or test result is shown.</text>
</svg>

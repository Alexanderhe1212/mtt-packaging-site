name: Deploy MTT Packaging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prepare static website
        run: |
          mkdir -p _site
          unzip -q mtt-packaging-edgeone.zip -d _site
          echo mttpackaging.com > _site/CNAME
          touch _site/.nojekyll
          echo "$GITHUB_SHA" > _site/deployment-revision.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow after verified deployment
        run: |
          git show HEAD^:mtt-packaging-edgeone.zip > /tmp/mtt-previous.zip
          python3 scripts/indexnow-submit.py --root _site --previous /tmp/mtt-previous.zip --revision "$GITHUB_SHA" --submit --output /tmp/indexnow-result.json
      - name: Save IndexNow receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt
          path: /tmp/indexnow-result.json
          if-no-files-found: ignore

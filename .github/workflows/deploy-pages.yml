name: Deploy MTT Packaging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build and validate source
        env:
          MTT_STATIC_EXPORT: '1'
        run: |
          npm ci --no-audit --no-fund
          npm run audit:dependencies
          npm run build
          npm run check:types
          npm run lint
          npm run check:release
      - name: Verify interactive buyer flows
        env:
          MTT_TEST_ORIGIN: http://127.0.0.1:4217
        run: |
          python3 -m http.server 4217 --bind 127.0.0.1 --directory dist/client > /tmp/mtt-qa-server.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4217/ > /dev/null; then break; fi
            sleep 1
          done
          npm run audit:enquiry
          npm run audit:guides
          npm run audit:catalogue
          npm run audit:studio
      - name: Audit performance and accessibility
        run: npm run audit:site
      - name: Save website audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-audit-reports
          path: |
            qa/lighthouse-report
            work/growth/v12-browser.json
          if-no-files-found: ignore
      - name: Prepare static website
        run: |
          previous_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --output /tmp/mtt-previous-manifest.json --write-out '%{http_code}' "https://mttpackaging.com/indexnow-content-manifest.json?before=$GITHUB_SHA")
          case "$previous_status" in
            200) python3 -c "import runpy; runpy.run_path('scripts/indexnow-submit.py')['read_manifest']('/tmp/mtt-previous-manifest.json')" ;;
            404) rm /tmp/mtt-previous-manifest.json ;;
            *) echo "Cannot verify prior content baseline: HTTP $previous_status"; exit 1 ;;
          esac
          mkdir -p _site
          cp -a dist/client/. _site/
          echo mttpackaging.com > _site/CNAME
          touch _site/.nojekyll
          echo "$GITHUB_SHA" > _site/deployment-revision.txt
          python3 scripts/indexnow-submit.py --root _site --revision "$GITHUB_SHA" --require-baseline --write-manifest _site/indexnow-content-manifest.json --output /tmp/indexnow-preview.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow after verified deployment
        run: |
          baseline=()
          if [ -f /tmp/mtt-previous-manifest.json ]; then baseline=(--previous-manifest /tmp/mtt-previous-manifest.json); fi
          python3 scripts/indexnow-submit.py --root _site "${baseline[@]}" --require-baseline --revision "$GITHUB_SHA" --submit --output /tmp/indexnow-result.json
      - name: Save IndexNow receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt
          path: /tmp/indexnow-result.json
          if-no-files-found: ignore
